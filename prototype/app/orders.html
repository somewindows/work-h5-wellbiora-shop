<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的订单">
<title>我的订单 · WELLBIORA 海外旗舰店</title>
<style>
/* ============================================================
 * WELLBIORA H5 · 订单列表页（MVP 第 7 页，V3 统一原型）
 * 设计令牌提取自 style.css / style-v2.css（v0.3 规范）
 * 风格基线延续 cart.html / checkout.html / mine.html
 * 状态集：待付款 pay / 待发货 ship / 待收货 recv / 已完成 done
 * ============================================================ */
:root {
  --green: #033B3C;
  --green-dark: #022829;
  --mint: #D9EDE2;
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text2: #6B6660;
  --text3: #A8A29A;
  --line: #EAE6DF;
  --red: #E6432D;
  --ok: #2BA471;
  --warn: #ED7B2F;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: #EAE6DF;
  color: var(--text);
}
.page {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100dvh;
}
img { display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* ---------- 顶部导航栏（同 checkout.html） ---------- */
.navbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center;
  height: calc(48px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 4px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.navbar .back {
  width: 44px; height: 48px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
}
.navbar .back svg { width: 22px; height: 22px; }
.navbar .title { flex: 1; text-align: center; font-size: 16px; font-weight: 700; }
.navbar .gap { width: 44px; flex-shrink: 0; }

/* ---------- 状态 Tab（吸顶，可横滑） ---------- */
.tabs {
  position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 39;
  display: flex; gap: 4px;
  background: var(--bg);
  padding: 4px 8px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 1; min-width: 64px; height: 40px;
  background: none; border: none; cursor: pointer;
  font-size: 13px; color: var(--text2);
  position: relative;
}
.tabs button.on { color: var(--green); font-weight: 700; }
.tabs button.on::after {
  content: ""; position: absolute; left: 50%; bottom: 2px;
  transform: translateX(-50%);
  width: 18px; height: 3px; border-radius: 999px;
  background: var(--green);
}

/* ---------- 订单卡 ---------- */
.ocard {
  margin: 12px 12px 0;
  background: var(--card);
  border-radius: 16px;
  padding: 14px;
}
.ocard .o-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.ocard .o-no { font-size: 11px; color: var(--text3); font-family: Georgia, serif; letter-spacing: .04em; }
.ocard .o-status { font-size: 13px; font-weight: 700; color: var(--green); }
.ocard .o-status.warn { color: var(--warn); }

.oitem { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.oitem .pic {
  width: 60px; height: 60px; flex-shrink: 0;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.oitem .pic img { width: 88%; height: 88%; object-fit: contain; mix-blend-mode: multiply; }
.oitem .info { flex: 1; min-width: 0; }
.oitem .name { font-size: 13px; font-weight: 700; line-height: 1.35; }
.oitem .spec { font-size: 11px; color: var(--text3); margin-top: 3px; }
.oitem .right { text-align: right; flex-shrink: 0; }
.price { color: var(--red); font-weight: 700; font-size: 16px; line-height: 1; }
.price .cur { font-size: 11px; margin-right: 1px; }
.oitem .qty { font-size: 11px; color: var(--text3); margin-top: 6px; }

.ocard .o-sum {
  display: flex; justify-content: flex-end; align-items: baseline; gap: 6px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--text2);
}
.ocard .o-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 12px;
}
.btn-ghost, .btn-main {
  height: 34px; padding: 0 18px;
  border-radius: 999px;
  font-size: 13px; cursor: pointer;
}
.btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--text2); }
.btn-main { background: var(--green); border: 1px solid var(--green); color: #fff; font-weight: 600; }
.btn-ghost:active, .btn-main:active { transform: scale(.96); }

/* 卡片整体可点 → 详情；按钮阻止冒泡 */
.ocard .o-link { display: block; }

/* ---------- 空态 ---------- */
.empty { padding: 72px 24px 40px; text-align: center; display: none; }
.empty .e-ico {
  width: 88px; height: 88px; margin: 0 auto;
  border-radius: 50%; background: var(--mint);
  display: flex; align-items: center; justify-content: center;
}
.empty .e-ico svg { width: 38px; height: 38px; stroke: var(--green); }
.empty .e-t { font-size: 15px; font-weight: 600; margin-top: 18px; }
.empty .e-s { font-size: 12px; color: var(--text2); margin-top: 6px; }
.empty .e-btn {
  display: inline-block; margin-top: 22px;
  height: 48px; line-height: 48px; padding: 0 40px;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 600;
  border-radius: 999px;
}

/* ---------- 页脚合规小字 ---------- */
.foot {
  margin-top: 24px; padding-bottom: 24px;
  text-align: center;
  font-size: 10px; color: var(--text3);
  line-height: 1.8;
}
.foot .en { font-family: Georgia, serif; letter-spacing: .14em; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,.72); color: #fff;
  font-size: 13px; padding: 10px 18px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 99;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">

  <!-- 顶部导航 -->
  <div class="navbar">
    <a class="back" href="mine.html" aria-label="返回我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="title">我的订单</div>
    <div class="gap"></div>
  </div>

  <!-- 状态 Tab -->
  <div class="tabs" id="tabs"></div>

  <!-- 订单列表 -->
  <div id="list"></div>

  <!-- 空态 -->
  <div class="empty" id="empty">
    <div class="e-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/></svg>
    </div>
    <div class="e-t">暂无相关订单</div>
    <div class="e-s">去挑选适合你的脂质体营养吧</div>
    <a class="e-btn" href="products-v2.html">去逛逛</a>
  </div>

  <!-- 页脚 -->
  <div class="foot">
    <div class="en">WELLBIORA™ LIPOSOMAL NUTRITION</div>
    <div>欧洲制造 · 义乌保税仓直发（1210 保税备货）</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="orders-data.js"></script>
<script>
const TABS = [
  { key: 'all',  label: '全部' },
  { key: 'pay',  label: '待付款' },
  { key: 'ship', label: '待发货' },
  { key: 'recv', label: '待收货' },
  { key: 'done', label: '已完成' },
];

let curTab = new URLSearchParams(location.search).get('tab') || 'all';
if (!TABS.some(t => t.key === curTab)) curTab = 'all';

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="${t.key === curTab ? 'on' : ''}" onclick="switchTab('${t.key}')">${t.label}</button>`
  ).join('');
}

function switchTab(key) {
  curTab = key;
  history.replaceState(null, '', 'orders.html?tab=' + key);
  renderTabs();
  renderList();
}

function actions(o) {
  // 各状态的主操作；按钮点击不进详情
  switch (o.status) {
    case 'pay':
      return `<button class="btn-ghost" onclick="event.preventDefault();cancelOrder('${o.no}')">取消订单</button>
              <button class="btn-main" onclick="event.preventDefault();payOrder('${o.no}')">去支付</button>`;
    case 'ship':
      return `<button class="btn-ghost" onclick="event.preventDefault();toast('已提醒仓库优先打包（演示）')">提醒发货</button>`;
    case 'recv':
      return `<button class="btn-ghost" onclick="event.preventDefault();location.href='order.html?no=${o.no}#logistics'">查看物流</button>
              <button class="btn-main" onclick="event.preventDefault();confirmRecv('${o.no}')">确认收货</button>`;
    case 'done':
      return `<button class="btn-ghost" onclick="event.preventDefault();location.href='product-v2.html?id=${o.items[0].id}'">再次购买</button>`;
  }
  return '';
}

function renderList() {
  const orders = curTab === 'all' ? ORDERS : ORDERS.filter(o => o.status === curTab);
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  if (!orders.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = orders.map(o => `
    <div class="ocard" data-screen-label="订单卡 ${o.no}">
      <a class="o-link" href="order.html?no=${o.no}">
        <div class="o-head">
          <span class="o-no">${o.no}</span>
          <span class="o-status ${o.status === 'pay' ? 'warn' : ''}">${ORDER_STATUS[o.status].label}</span>
        </div>
        ${o.items.map(p => `
          <div class="oitem">
            <div class="pic" style="background:${p.themeLight}"><img src="${p.img}" alt="${p.name}"></div>
            <div class="info">
              <div class="name">${p.name}</div>
              <div class="spec">${p.spec}</div>
            </div>
            <div class="right">
              <div class="price"><span class="cur">¥</span>${p.price}</div>
              <div class="qty">×${p.qty}</div>
            </div>
          </div>`).join('')}
        <div class="o-sum">共 ${orderCount(o)} 件 · 实付 <span class="price"><span class="cur">¥</span>${orderTotal(o)}</span></div>
      </a>
      <div class="o-actions">${actions(o)}</div>
    </div>`).join('');
}

/* 主操作（演示） */
function payOrder(no) {
  location.href = 'checkout.html'; // 原型：直接复用结算页演示支付链路
}
function cancelOrder(no) {
  toast('取消订单：需二次确认弹窗（后续迭代）');
}
function confirmRecv(no) {
  const o = findOrder(no);
  o.status = 'done';
  toast('已确认收货');
  renderList();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

renderTabs();
renderList();
</script>
</body>
</html>
