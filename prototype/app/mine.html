<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的">
<title>我的 · WELLBIORA 海外旗舰店</title>
<style>
/* ============================================================
 * WELLBIORA H5 · 个人中心「我的」页（MVP 第 8 页）
 * 设计令牌提取自 prototype/app/style-v2.css（v0.3 规范）
 * 风格基线延续 designs/h5-shop/购物车 Cart.html
 * 参考：ActiNovo / LemonBox 个人中心骨架（只借结构不借色）
 *   用户信息区 → 我的订单五态 → 服务列表 → 推荐商品
 *   MVP 裁剪：会员等级/积分/钱包/任务中心/优惠券/邀请分销
 * ============================================================ */
:root {
  --green: #033B3C;
  --green-dark: #022829;
  --mint: #D9EDE2;
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text2: #6B6660;
  --text3: #A8A29A;
  --line: #EAE6DF;
  --red: #E6432D;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: #EAE6DF;
  color: var(--text);
}
.page {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100dvh;
  /* 底部预留：tabbar 50px + 安全区 */
  padding-bottom: calc(50px + env(safe-area-inset-bottom) + 20px);
}
img { display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* ---------- 用户信息区（品牌深墨绿） ---------- */
.mine-head {
  background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
  padding: calc(20px + env(safe-area-inset-top)) 16px 44px;
  color: #fff;
}
.mine-head .kick {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(217, 237, 226, .65);
}
.mine-head .user {
  display: flex; align-items: center; gap: 12px;
  margin-top: 16px;
  min-height: 56px;
}
.mine-head .avatar {
  width: 56px; height: 56px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  border: 2px solid rgba(255,255,255,.35);
}
.mine-head .avatar svg { width: 28px; height: 28px; stroke: var(--green); }
.mine-head .uinfo { flex: 1; min-width: 0; }
.mine-head .uname { font-size: 19px; font-weight: 700; line-height: 1.3; }
.mine-head .usub { font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px; }
.mine-head .login-btn {
  height: 36px; padding: 0 20px;
  background: #fff; color: var(--green);
  font-size: 13px; font-weight: 600;
  border: none; border-radius: 999px; cursor: pointer;
}
.mine-head .login-btn:active { transform: scale(.96); }

/* ---------- 卡片通用 ---------- */
.mcard {
  margin: 12px 12px 0;
  background: var(--card);
  border-radius: 16px;
  padding: 16px 14px;
}
.mcard.overlap { margin-top: -28px; position: relative; z-index: 1; }

/* ---------- 我的订单 ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; }
.sec-head .t { font-size: 15px; font-weight: 700; }
.sec-head .more {
  font-size: 12px; color: var(--text3);
  display: flex; align-items: center; gap: 2px;
  padding: 8px 0 8px 8px;
  background: none; border: none; cursor: pointer;
}
.sec-head .more svg { width: 12px; height: 12px; stroke: var(--text3); }
.order-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  margin-top: 12px;
}
.order-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 6px 0;
  min-height: 44px;
  background: none; border: none; cursor: pointer;
  font-size: 11px; color: var(--text2);
}
.order-item:active { opacity: .6; }
.order-item svg { width: 24px; height: 24px; stroke: var(--text); }
.order-item .obadge {
  position: absolute; top: 0; left: calc(50% + 4px);
  min-width: 15px; height: 15px; border-radius: 999px;
  background: var(--red); color: #fff;
  font-size: 9px; line-height: 15px; text-align: center;
  padding: 0 4px;
}

/* ---------- 服务列表（cell） ---------- */
.svc { padding: 4px 14px; }
.cell {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 8px 0;
  background: none; border: none; cursor: pointer;
  text-align: left;
  font-size: 14px; color: var(--text);
}
.cell + .cell { border-top: 1px solid var(--line); }
.cell:active { opacity: .6; }
.cell .cico {
  width: 34px; height: 34px; flex-shrink: 0;
  border-radius: 10px;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
}
.cell .cico svg { width: 17px; height: 17px; stroke: var(--green); }
.cell .cbody { flex: 1; min-width: 0; }
.cell .ct { font-size: 14px; font-weight: 600; line-height: 1.3; }
.cell .cs { font-size: 11px; color: var(--text3); margin-top: 2px; }
.cell .arrow { width: 14px; height: 14px; stroke: var(--text3); flex-shrink: 0; }

/* ---------- 为你推荐 ---------- */
.rec { margin-top: 20px; padding: 0 12px; }
.rec .kick {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--text3);
  text-align: center;
}
.rec .cn { font-size: 20px; font-weight: 700; text-align: center; margin-top: 6px; }
.rec-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-top: 14px;
}
.pcard {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  display: block;
}
.pcard .pic {
  height: 132px;
  display: flex; align-items: center; justify-content: center;
}
.pcard .pic img { width: 78%; height: 78%; object-fit: contain; mix-blend-mode: multiply; }
.pcard .pbody { padding: 10px 12px 12px; }
.pcard .pname { font-size: 13px; font-weight: 700; line-height: 1.35; }
.pcard .pen {
  font-family: Georgia, serif; font-size: 10px; color: var(--text2);
  letter-spacing: .04em; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pcard .prow { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.price { color: var(--red); font-weight: 700; font-size: 18px; line-height: 1; }
.price .cur { font-size: 11px; margin-right: 1px; }
.add-btn {
  width: 44px; height: 44px; margin: -8px -8px -6px 0;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.add-btn b {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--green); color: #fff;
  font-size: 17px; font-weight: 400; line-height: 25px; text-align: center;
}
.add-btn:active b { transform: scale(.9); }

/* ---------- 页脚合规小字 ---------- */
.mine-foot {
  margin-top: 24px;
  text-align: center;
  font-size: 10px; color: var(--text3);
  line-height: 1.8;
}
.mine-foot .en { font-family: Georgia, serif; letter-spacing: .14em; }

/* ---------- Tabbar（沿用 style.css，我的选中） ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 50;
}
.tabbar a {
  flex: 1; position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 7px 0 5px;
  font-size: 10px; color: var(--text3);
}
.tabbar a.on { color: var(--green); font-weight: 600; }
.tabbar svg { width: 22px; height: 22px; margin-bottom: 2px; }
.tabbar .badge {
  position: absolute; top: 2px; left: calc(50% + 2px);
  min-width: 15px; height: 15px; border-radius: 999px;
  background: var(--red); color: #fff;
  font-size: 9px; line-height: 15px; text-align: center;
  padding: 0 4px;
}

/* ---------- 底部弹层（客服 / 协议） ---------- */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
  z-index: 80;
}
.mask.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; transform: translate(-50%, 100%);
  bottom: 0;
  width: 100%; max-width: 480px;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  transition: transform .3s ease-out;
  z-index: 81;
}
.sheet.show { transform: translate(-50%, 0); }
.sheet .s-kick {
  font-family: Georgia, serif; font-size: 10px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--text3); text-align: center;
}
.sheet .s-title { font-size: 17px; font-weight: 700; text-align: center; margin-top: 5px; }
.sheet .s-desc {
  font-size: 12px; color: var(--text2); text-align: center;
  margin-top: 10px; line-height: 1.7;
}
.sheet .s-btn {
  display: block; width: 100%; height: 48px;
  margin-top: 16px;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 600;
  border: none; border-radius: 999px; cursor: pointer;
}
.sheet .s-btn:active { transform: scale(.98); }
.sheet .s-btn.ghost {
  background: none; color: var(--text2);
  font-weight: 400; margin-top: 4px;
}
.sheet .doc-item {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
  background: var(--card); border: none; cursor: pointer;
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.sheet .doc-item:active { opacity: .6; }
.sheet .doc-item svg { width: 14px; height: 14px; stroke: var(--text3); }

/* ---------- Toast（沿用 style.css） ---------- */
.toast {
  position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,.72); color: #fff;
  font-size: 13px; padding: 10px 18px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 99;
}
.toast.show { opacity: 1; }

/* ---------- 演示开关（tweaks，仅原型用） ---------- */
.tweaks-btn {
  position: fixed; right: 12px;
  bottom: calc(50px + env(safe-area-inset-bottom) + 16px);
  z-index: 60;
  background: var(--text); color: #fff;
  font-size: 11px; padding: 7px 12px;
  border: none; border-radius: 999px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
.tweaks {
  position: fixed; right: 12px;
  bottom: calc(50px + env(safe-area-inset-bottom) + 56px);
  z-index: 60;
  background: #fff; border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  font-size: 12px; color: var(--text2);
  display: none;
}
.tweaks.open { display: block; }
.tweaks label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
</style>
</head>
<body>

<script>
/* 商品数据与 prototype/app/data.js 保持一致（价格为示例占位价） */
const PRODUCTS = [
  { id: 'p1', name: '脂质体谷胱甘肽饮', en: 'Liposomal Glutathione', price: 329, themeLight: '#E3F0F3', img: 'assets/p1-main.jpg' },
  { id: 'p2', name: '脂质体维生素C饮', en: 'Liposomal Vitamin C', price: 259, themeLight: '#FDEED2', img: 'assets/p2-main.jpg' },
  { id: 'p3', name: '脂质体睡眠喷雾', en: 'Liposomal Sleep Spray', price: 289, themeLight: '#E4E9F6', img: 'assets/p3-box.jpg' },
  { id: 'p4', name: '脂质体D3+K2+Q10饮', en: 'Liposomal D3+K2+Q10', price: 299, themeLight: '#F0E4EB', img: 'assets/p4-main.jpg' },

let loggedIn = true;
let cartCount = 3;

const AVATAR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>';

function renderUser() {
  const row = document.getElementById('userRow');
  if (loggedIn) {
    row.innerHTML = `
      <div class="avatar">${AVATAR_SVG}</div>
      <div class="uinfo">
        <div class="uname">WELL 会员</div>
        <div class="usub">138****8888 · 已完成实名认证</div>
      </div>`;
  } else {
    row.innerHTML = `
      <div class="avatar">${AVATAR_SVG}</div>
      <div class="uinfo">
        <div class="uname">未登录</div>
        <div class="usub">登录后查看订单与管理地址</div>
      </div>
      <button class="login-btn" onclick="location.href='login.html?from=mine.html'">立即登录</button>`;
  }
}

function renderRec() {
  document.getElementById('recGrid').innerHTML = PRODUCTS.map(p => `
    <a class="pcard" href="product-v2.html?id=${p.id}">
      <div class="pic" style="background:${p.themeLight}"><img src="${p.img}" alt="${p.name}"></div>
      <div class="pbody">
        <div class="pname">${p.name}</div>
        <div class="pen">${p.en}</div>
        <div class="prow">
          <div class="price"><span class="cur">¥</span>${p.price}</div>
          <button class="add-btn" onclick="addCart(event, '${p.name}')" aria-label="加入购物车"><b>＋</b></button>
        </div>
      </div>
    </a>`).join('');
}

function addCart(e, name) {
  e.preventDefault();
  e.stopPropagation();
  cartCount++;
  updateBadge();
  toast('已加入购物车');
}

function updateBadge() {
  const b = document.getElementById('cartBadge');
  b.textContent = cartCount;
  b.style.display = cartCount ? 'block' : 'none';
}

/* 底部弹层 */
function openSheet(id) {
  document.getElementById('mask').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeSheets() {
  document.getElementById('mask').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
}
function copyKefu() {
  closeSheets();
  toast('客服微信号已复制（演示）');
}

/* 待设计页面的占位提示 */
function todo(name) {
  closeSheets();
  toast(name + '：原型待设计');
}

/* 演示开关 */
let badgesOn = true;
function demoLogout(off) {
  loggedIn = !off;
  renderUser();
  demoBadges(badgesOn);
}
function demoBadges(on) {
  badgesOn = on;
  document.querySelectorAll('.obadge').forEach(b => {
    b.style.display = on && loggedIn ? 'block' : 'none';
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

renderUser();
renderRec();
updateBadge();
demoBadges(true);
</script>
</body>
