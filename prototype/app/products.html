<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全部产品 - WELLBIORA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="topbar">
    <img class="logo" src="assets/logo-h.jpg" alt="WELLBIORA">
    <svg class="cart-ico" viewBox="0 0 24 24" fill="none" stroke="#033B3C" stroke-width="1.8">
      <path d="M3 3h2l2.4 12.2A2 2 0 0 0 9.36 17H18a2 2 0 0 0 1.95-1.55L21.5 8H6"/>
      <circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/>
    </svg>
  </div>

  <div class="sec-head">
    <div class="t">全部产品</div>
    <div class="more" id="count"></div>
  </div>
  <div class="grid" id="listGrid"></div>

  <div style="height:24px"></div>
</div>

<nav class="tabbar">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    首页
  </a>
  <a href="products.html" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
    产品
  </a>
  <a href="#" onclick="toast('购物车为演示占位');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.2A2 2 0 0 0 9.36 17H18a2 2 0 0 0 1.95-1.55L21.5 8H6"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>
    购物车
  </a>
  <a href="#" onclick="toast('个人中心为演示占位');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
    我的
  </a>
</nav>

<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
document.getElementById('count').textContent = PRODUCTS.length + ' 件商品';
document.getElementById('listGrid').innerHTML = PRODUCTS.map(p => `
  <a class="pcard" href="product.html?id=${p.id}">
    <div class="pic" style="background:${p.themeLight}"><img src="${p.cardImg}" alt="${p.name}" loading="lazy"></div>
    <div class="body">
      <div class="name">${p.name}</div>
      <div class="sub">${p.flavor} · ${p.spec}</div>
      <div class="row">
        <div class="price"><span class="cur">¥</span>${p.price}<span class="hint">示例价</span></div>
        <button class="addbtn" onclick="event.preventDefault();toast('已加入购物车（演示）')">+</button>
      </div>
    </div>
  </a>`).join('');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
</script>
<a class="v-switch" href="products-v2.html">V2 新版</a>
</body>
</html>
